<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Japan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <h1>Discover Japan</h1>
    </nav>

    <section class="hero">
        <h2>Experience the Beauty of Japan</h2>
        <p>From neon-lit Tokyo streets to peaceful Kyoto temples.</p>
        <button>Explore Now</button>
    </section>

      <section class="destinations">
    <h2>Top Destinations</h2>

    <div class="cards">
        <div class="card">
            <img
        src="https://images.unsplash.com/photos-1540959733332
        -eab4deabeeaf" alt="Tokyo">

            <h3>Tokyo</h3>
            <p>The city of the future.</p>
        </div>

        <div class="card">
            <img
        src="https://images.unplash.com/photo-1493976040374-85c8e
        12f0c0e" alt="Kyoto">

            <h3>Kyoto</h3>
            <p>Historic temples and culture.</p>
        </div>

        <div class="card">
            <img
        src="https://images.unplash.com/photo-1590559899731-a3828
        39e5549" alt="Osaka">
            <h3>Osaka</h3>
            <p>Food capital of Japan.</p>
        </div>
    </div>
</section>
    <script src="script.js"></script>
</body>
</html>
